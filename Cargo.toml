[package]
name = "crabclip"
version = "0.1.0"
edition = "2024"
description = "A forever clipboard history for macOS: native AppKit menu bar app with a SQLite history"
license = "MIT"
repository = "https://github.com/rodrigolive/crabclip"
readme = "README.md"
keywords = ["clipboard", "macos", "appkit", "clipboard-manager"]
categories = ["gui"]

[dependencies]
blake3 = "1.8.7"
chacha20poly1305 = "0.10"
chrono = "0.4.45"
dispatch2 = "0.3.1"
global-hotkey = "0.10.0"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
plist = "1.10.4"
rusqlite = { version = "0.43.0", features = ["bundled"] }
security-framework = "3"
zstd = "0.14.4"
